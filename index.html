<!DOCTYPE html>
<html lang="tr">
<head>

<meta name="mobile-web-app-capable" content="yes">

<title>Calisthenics Takip</title>
<style>
:root{--bg:#f4f6fb;--card:#ffffff;--ink:#1f2937;--mute:#6b7787;--line:#e3e8f0;--acc:#4f7cff;--onacc:#ffffff;--c1:#4f7cff;--c2:#f2994a;--c3:#3fae85;--c4:#e0709f;--c5:#8b7be8;--bad:#e0585f}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,"Segoe UI",system-ui,sans-serif;transition:background .4s;min-height:100vh}
#hd{position:sticky;top:0;z-index:6;background:linear-gradient(120deg,#2f6df6,#8b5cf6 60%,#e53f8a);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(6px + env(safe-area-inset-top)) 6px 6px}
#hd b{font-size:20px}
.hb{width:48px;height:44px;background:none;border:0;color:#fff;font-size:30px;cursor:pointer;line-height:1}
main{max-width:640px;margin:auto;padding:16px 16px 28px}
main.hasbar{padding-bottom:120px}main.full{padding:0;max-width:none}
h2{font-size:21px;margin:0 0 10px}h3{font-size:18px;margin:0 0 8px}h3.sec{margin:18px 2px 8px;color:var(--mute);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c1);border-radius:16px;padding:14px;margin-bottom:14px}
.card.k2{border-left-color:var(--c2)}.card.k3{border-left-color:var(--c3)}.card.k4{border-left-color:var(--c4)}.card.k5{border-left-color:var(--c5)}
input,select{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
button{font:inherit}
button.b{min-height:54px;font-size:18px;font-weight:700;background:linear-gradient(120deg,var(--c1),var(--c5));color:#fff;border:0;border-radius:16px;padding:0 22px;cursor:pointer}
button.g,label.g{min-height:48px;display:inline-flex;align-items:center;justify-content:center;background:none;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:0 16px;cursor:pointer;font-weight:600}
button.wide,label.wide{width:100%;margin-bottom:12px}
button.sm{min-height:38px;padding:0 12px;font-size:15px;border-radius:12px}
button.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:22px;width:44px;height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.mute{color:var(--mute);font-size:15px}.center{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.bar button{flex:1}
.hello{font-size:26px;font-weight:800;margin:4px 2px 14px}
.today{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,#ff7a1a,#e53f8a);margin-bottom:16px;box-shadow:0 6px 18px rgba(229,63,138,.3)}
.today small{opacity:.9;font-size:15px}.today b{display:block;font-size:26px;margin:2px 0}.today span{display:block;margin-bottom:12px;opacity:.95}
.today button{background:#fff;color:#c2185b;width:100%}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border:0;border-radius:22px;min-height:136px;color:#fff;font-size:20px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.tile span{font-size:42px;line-height:1}
.li{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;cursor:pointer}
.li b{font-size:18px}
.weekbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.tag{font-size:13px;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--mute);white-space:nowrap;display:inline-block}
.tag.ok{color:var(--c3);border-color:var(--c3)}.tag.warn{color:var(--c2);border-color:var(--c2)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.up{color:var(--c3);font-weight:700}.dn{color:var(--bad);font-weight:700}.fl{color:var(--mute);font-weight:700}
.sr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:700}
.sr:last-child{border:0}
.stp{display:flex;align-items:center;gap:6px}

.seg2{display:flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;margin:8px 0}
.seg2 button{flex:1;min-height:50px;border:0;background:none;color:var(--ink);font-weight:700;cursor:pointer}

.dchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.dchip{flex:none;min-width:58px;padding:8px 6px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center;line-height:1.2;cursor:pointer}
.dchip.on{background:var(--c1);border-color:var(--c1);color:#fff}.dchip small{display:block;font-size:12px;opacity:.85}
.dots2{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}.dots2 i{width:34px;height:8px;border-radius:4px;background:var(--line)}.dots2 i.d{background:var(--c3)}.dots2 i.n{background:var(--c1)}
.mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:8px 4px;text-align:center;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.mt.on{border-color:var(--c1);background:#2f6df61a}
.addbtn{width:100%;min-height:60px;border:2px dashed var(--c1);border-radius:16px;background:none;color:var(--c1);font-weight:800;font-size:18px;cursor:pointer;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:12px}
.stat{border:2px solid;border-radius:14px;padding:10px;font-size:14px}.stat b{display:block;font-size:26px;line-height:1.2}
.s1{background:#2f6df61a;border-color:var(--c1)}.s2{background:#ff7a1a1a;border-color:var(--c2)}.s3{background:#16a36a1a;border-color:var(--c3)}.s4{background:#e53f8a1a;border-color:var(--c4)}.s6{background:#d93a3a1a;border-color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.ex{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
label.s{display:flex;flex-direction:column;font-size:14px;font-weight:600;gap:2px}
.mi{border-radius:12px;object-fit:cover;flex:none;display:inline-block}.mi.ph{background:linear-gradient(135deg,var(--c1),var(--c4));color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.ch{width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:6px 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px}

.seg{display:flex;height:18px;border-radius:9px;overflow:hidden;margin:8px 0}.seg i{display:block}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.pg img,.cmp img{width:100%;border-radius:12px;display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* antrenman ekranı */
.wk{min-height:100vh;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 130px}
.wk .mute{color:rgba(255,255,255,.88)}
.wk button.g{color:#fff;border-color:rgba(255,255,255,.7)}
.wk .stp button{background:rgba(255,255,255,.25);color:#fff}.wk .stp input{background:#fff;color:#16202b;border-color:#fff}
.wk .sr{border-color:rgba(255,255,255,.3)}
.bar.wb{background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:0}
.bar.wb button.b{background:#fff;color:#111}.bar.wb button.g{color:#fff;border-color:rgba(255,255,255,.7)}
.badge{display:inline-block;background:rgba(0,0,0,.28);border-radius:20px;padding:6px 16px;font-size:20px;font-weight:800;margin-bottom:10px}
.timebar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.timebar b.t{font-size:30px;font-variant-numeric:tabular-nums}
.pbar{height:16px;background:rgba(255,255,255,.3);border-radius:8px;overflow:hidden;margin-bottom:14px}
.pbar i{display:block;height:100%;width:0;border-radius:8px;transition:width .8s ease;background:repeating-linear-gradient(45deg,#fff 0 12px,#ffe27a 12px 24px);background-size:34px 34px;animation:mv 1s linear infinite}
@keyframes mv{to{background-position:34px 0}}
@media(prefers-reduced-motion:reduce){.pbar i{animation:none}}
.plabel{display:flex;justify-content:space-between;font-weight:700;margin:4px 0 6px}
.mvname{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.mvname span{font-size:36px;font-weight:800;line-height:1.1}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{flex:1;min-width:96px;border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.2);text-align:center}
.chip small{display:block;font-size:16px;font-weight:700}.chip b{font-size:42px;line-height:1.1}.chip i{font-size:18px;font-style:normal;opacity:.9}
.dots{display:flex;gap:6px;margin-bottom:12px}.dots i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.35)}.dots i.d{background:#fff}.dots i.n{background:#ffd54a;box-shadow:0 0 0 3px rgba(255,255,255,.5)}
.bigcd{font-size:96px;font-weight:800;letter-spacing:-2px;line-height:1.1;margin:6px 0}
.info{background:rgba(0,0,0,.22);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:17px}
.chg{background:rgba(255,255,255,.22);border:2px dashed #fff;border-radius:14px;padding:10px 14px;margin:8px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1}

.s5{background:#8b5cf61a;border-color:var(--c5)}
.hello{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none}
.avatar.ph{background:linear-gradient(135deg,var(--c1),var(--c4));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.anim{height:200px;background:rgba(255,255,255,.14);border-radius:18px;margin:6px 0 12px;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.anim svg{height:100%;width:auto;max-width:100%}.vimg{max-height:100%;max-width:100%;object-fit:contain}.vph{font-size:80px;font-weight:800;opacity:.6}
.av{background:linear-gradient(135deg,var(--c1),var(--c5));color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:3px}.av svg{width:100%;height:100%}
.mt small{font-size:12px;font-weight:700}
.donut{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.donut svg{width:150px;height:150px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-auto-columns:1fr;gap:4px}.heat i{aspect-ratio:1;border-radius:4px;min-width:12px;background:var(--c3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cal b{font-size:12px;color:var(--mute)}.cal span{padding:8px 0;border-radius:10px;background:var(--bg);font-weight:700}
.cal span.ok{background:var(--c3);color:#fff}.cal span.half{background:var(--c2);color:#fff}.cal span.miss{background:var(--bad);color:#fff}.cal span.plan{border:2px solid var(--c1)}.cal span.td{outline:2px solid var(--ink)}
.rg{margin-bottom:12px}.rg .top{display:flex;justify-content:space-between;font-weight:700}.rg .meter{height:14px;border-radius:7px;background:var(--line);position:relative;overflow:hidden;margin:4px 0}
.rg .meter i{display:block;height:100%;border-radius:7px;position:relative}.rg .zone{position:absolute;top:0;bottom:0;background:rgba(22,163,106,.3);z-index:1}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.rpe button{height:72px;border:0;border-radius:16px;font-size:30px;font-weight:800;color:#fff;cursor:pointer}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:8px 0 12px}.fchip{flex:none;padding:8px 14px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer}.fchip.on{background:var(--c5);border-color:var(--c5);color:#fff}
.srch{width:100%;margin-bottom:8px}
select.rsel{padding:2px 8px;font-size:14px;border-radius:10px;min-height:34px;margin-top:4px}

/* ---- yumuşak tema ---- */
#hd{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 6px 8px}
#hd b{font-size:18px;font-weight:700}
.hb{color:var(--ink);display:flex;align-items:center;justify-content:center;border:0;background:none}
.ic{display:inline-block;vertical-align:-4px;flex:none}
button.b{background:var(--c1);color:var(--onacc);display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:none}
button.g,label.g{gap:8px}
.card{border-radius:18px;border-left-width:4px;box-shadow:0 1px 2px rgba(20,30,50,.05)}
.stat{border-width:1px;border-radius:14px}
.s1{background:color-mix(in srgb,var(--c1) 10%,var(--card))}.s2{background:color-mix(in srgb,var(--c2) 10%,var(--card))}.s3{background:color-mix(in srgb,var(--c3) 10%,var(--card))}.s4{background:color-mix(in srgb,var(--c4) 10%,var(--card))}.s5{background:color-mix(in srgb,var(--c5) 10%,var(--card))}.s6{background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.mi.ph,.avatar.ph{background:var(--bg);background:color-mix(in srgb,var(--c1) 14%,var(--card));color:var(--c1)}
.av{background:var(--bg);background:color-mix(in srgb,var(--c1) 12%,var(--card));color:var(--c1)}
.tiles{gap:12px}
.tile{background:var(--card);background:color-mix(in srgb,var(--tf) 9%,var(--card));color:var(--ink);border:1px solid var(--line);box-shadow:none;min-height:116px;border-radius:20px;font-size:16px;font-weight:700;gap:10px}
.tile .tl{font-size:16px;font-weight:700}.tile span{font-size:inherit}
.tile .ti{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--tf);background:var(--card);background:color-mix(in srgb,var(--tf) 16%,var(--card))}
.hello{font-size:22px;font-weight:700;margin:2px 2px 14px}
.dash{border-left-width:1px}
.dtop{display:flex;justify-content:space-between;align-items:center}.dbig{font-size:22px;font-weight:800}.dmsg{margin:6px 0 4px;font-weight:600}
.ring{width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--c3) calc(var(--p)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center}
.ring span{width:46px;height:46px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.pbarS{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}.pbarS i{display:block;height:100%;background:var(--c3);border-radius:4px}
.drow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--bg);margin-top:8px;cursor:pointer}.drow.tdy{outline:2px solid var(--c1)}
.dwd{width:38px;font-weight:700;color:var(--mute);font-size:13px;text-align:center}.dtags{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0}
.tag.acc{color:var(--c1);border-color:var(--c1)}
.mv{display:flex;flex-direction:column}.mv .x{height:28px;width:40px}.x:disabled{opacity:.2;cursor:default}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.rchip{border:1px solid var(--line);background:none;color:var(--mute);border-radius:14px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer}.rchip.on{background:var(--rc);border-color:var(--rc);color:#fff}
.wkbtns{display:flex;gap:8px;margin-bottom:12px}.wkbtns button{flex:1}

.timebar{flex-wrap:wrap}
</style>

<body>
<header id="hd"></header>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const KEY="calisthenics_v1",C=["#2f6df6","#ff7a1a","#16a36a","#e53f8a","#8b5cf6"];
const MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const PAL=[["#1d4ed8","#3b82f6"],["#c2410c","#fb923c"],["#047857","#34d399"],["#be185d","#f472b6"],["#6d28d9","#a78bfa"],["#0e7490","#22d3ee"]];
let S=load(),READY=false,W=null,tm=null,P=null,WS={date:"",n:3,copy:false},NI="",WL=null,AC=null,MUTE=localStorage.getItem("cal_mute")==="1",AS={mv:"",wk:"",mo:""};
let ST=[{p:"home"}],FW=[],DIR=0,NEWACC=false,QS="",QR="",MQ="",PR=null,SW=null;
function load(d={}){
  const lib=(d.library||[]).map(m=>typeof m==="string"?{name:m,img:"",anim:"",regions:[]}:{...m,regions:m.regions||(m.region?[m.region]:[])}),weeks=d.weeks||[];
  weeks.forEach(w=>w.days.forEach(x=>x.exercises.forEach(e=>{if(e.name&&!lib.some(m=>m.name===e.name))lib.push({name:e.name,img:"",anim:"",regions:[]})})));
  return{weeks,status:d.status||{},library:lib,logs:d.logs||[],photos:d.photos||[],seeded:d.seeded===true?1:(+d.seeded||0),profile:d.profile||{}}}
let saveT=null,saveP=false;
const coreData=()=>({json:JSON.stringify({weeks:S.weeks,status:S.status,seeded:S.seeded})});
function save(){saveP=true;clearTimeout(saveT);saveT=setTimeout(()=>{saveP=false;cloud("core","main",coreData()).then(ok=>ok&&bk())},600);return true}
addEventListener("online",()=>{if(READY)save()});
addEventListener("pagehide",()=>{if(saveP&&READY){saveP=false;cloud("core","main",coreData())}});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0"),clone=o=>JSON.parse(JSON.stringify(o));
const fmt=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),parse=s=>new Date(s+"T00:00:00");
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dshort=s=>parse(s).toLocaleDateString("tr-TR",{weekday:"long",day:"2-digit",month:"2-digit",year:"numeric"});
const dm=s=>parse(s).toLocaleDateString("tr-TR",{day:"2-digit",month:"short"}),rng=m=>dm(m)+" – "+dm(fmt(addDays(parse(m),6)));

function lineChart(labels,series){
  const all=series.flatMap(s=>s.v).filter(x=>x!=null);if(!all.length)return"";
  let mn=Math.min(0,...all),mx=Math.max(0,...all);if(mx===mn)mx=mn+1;
  const w=600,H=210,L=46,R=16,T=14,B=28,pw=w-L-R,ph=H-T-B,n=labels.length,X=i=>L+(n<2?pw/2:i/(n-1)*pw),Y=v=>T+(mx-v)/(mx-mn)*ph;
  let g=[...new Set([mn,0,mx])].map(v=>`<line x1="${L}" x2="${w-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${v===0?'stroke-width="2"':'stroke-dasharray="3 4"'}/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11" fill="var(--mute)">${Math.round(v)}%</text>`).join("");
  g+=labels.map((l,i)=>`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mute)">${l}</text>`).join("");
  series.forEach(s=>{const pts=s.v.map((v,i)=>v==null?null:[X(i),Y(v),v]).filter(Boolean);
    g+=`<polyline points="${pts.map(p=>p[0]+","+p[1]).join(" ")}" fill="none" stroke="${s.c}" stroke-width="3" stroke-linejoin="round"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="${s.c}"><title>${s.n}: ${p[2].toFixed(0)}%</title></circle>`).join("")});
  return`<div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join("")}</div><svg viewBox="0 0 ${w} ${H}" class="ch">${g}</svg>`;
}
function barChart(labels,vals,c,unit=""){
  const mx=Math.max(...vals,1),w=600,H=190,B=26,T=22,n=vals.length,step=(w-20)/n,bw=Math.min(64,step*.65);
  return`<svg viewBox="0 0 ${w} ${H}" class="ch">`+vals.map((v,i)=>{const h=v/mx*(H-T-B),x=10+step*i+(step-bw)/2;
    return`<rect x="${x}" y="${H-B-h}" width="${bw}" height="${h}" rx="6" fill="${c}"/><text x="${x+bw/2}" y="${H-B-h-6}" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${Math.round(v)}${unit}</text><text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mute)">${labels[i]}</text>`}).join("")+`</svg>`;
}

const pushLib=m=>cloud("lib",hid(m.name),{name:m.name,img:m.img||"",anim:m.anim||"",mode:m.mode||"",regions:m.regions||[],region:(m.regions||[])[0]||""});
async function pushAll(){
  await cloud("core","main",coreData());await cloud("core","profile",{json:JSON.stringify(S.profile||{})});
  for(const l of S.logs)await pushLog(l);
  for(const m of S.library)await pushLib(m);
  for(const p of S.photos)await cloud("photos",String(p.id),{json:JSON.stringify(p)});
}
async function loadCloud(){
  const [co,lo,li,ph]=await Promise.all(["core","logs","lib","photos"].map(n=>FB.list(n)));
  const c=co.find(d=>d.id==="main"),pr=co.find(d=>d.id==="profile"),core=c?JSON.parse(c.data.json):{};
  S=load({weeks:core.weeks||[],status:core.status||{},seeded:core.seeded,profile:pr?JSON.parse(pr.data.json):{},
    library:li.map(x=>({name:x.data.name,img:x.data.img||"",anim:x.data.anim||"",mode:x.data.mode||"",regions:x.data.regions||(x.data.region?[x.data.region]:[])})),
    logs:lo.map(x=>JSON.parse(x.data.json)).sort((a,b)=>a.date.localeCompare(b.date)),photos:ph.map(x=>JSON.parse(x.data.json))});
  P=null;
  if(!c&&!lo.length&&!li.length&&!ph.length){
    let b=null,old=null;try{b=JSON.parse(localStorage.getItem("cal_bk_"+FB.user.uid))}catch(e){}try{old=JSON.parse(localStorage.getItem(KEY))}catch(e){}
    if(b&&((b.logs||[]).length+(b.weeks||[]).length)&&confirm("Buluttaki verin boş görünüyor ama bu cihazda bu hesabın yedeği var. Geri yüklensin mi?")){S=load(b);await pushAll()}
    else if(old&&(old.weeks||old.logs)&&confirm("Bu cihazda kayıtlı eski verilerin bulundu. Buluta aktarılsın mı?")){S=load(old);await pushAll()}
  }
  seedPresets();S.library.sort((a,b)=>a.name.localeCompare(b.name,"tr"));bk();
  setSync("Bulut verileri yüklendi ✓");
}
async function onFbUser(u){
  if(!u){READY=false;S=load();P=null;W=null;clearInterval(tm);LOADING=false;ST=[{p:"home"}];FW=[];render();return}
  LOADING=true;render();
  try{await loadCloud();READY=true;AUTHMSG="";ST=NEWACC?[{p:"home"},{p:"profile"}]:[{p:"home"}];PR=null;NEWACC=false}
  catch(e){AUTHMSG="Veriler yüklenemedi: "+(e.code==="permission-denied"?"Firestore kuralları izin vermiyor (kuralları ayarla).":(e.message||e.code));FB.logout()}
  LOADING=false;render();
}
const AERR={"auth/invalid-credential":"E-posta veya şifre hatalı.","auth/invalid-email":"Geçersiz e-posta adresi.","auth/user-not-found":"Bu e-posta ile hesap yok.","auth/wrong-password":"Şifre hatalı.","auth/email-already-in-use":"Bu e-posta zaten kayıtlı, giriş yapmayı dene.","auth/weak-password":"Şifre en az 6 karakter olmalı.","auth/operation-not-allowed":"Firebase konsolunda E-posta/Şifre girişini etkinleştirmen gerekiyor.","auth/network-request-failed":"İnternet bağlantısı yok.","auth/too-many-requests":"Çok fazla deneme, biraz bekle."};
async function fbAuth(){
  const e=$("em").value.trim(),p=$("pw2").value,r=$("rm").checked;if(!e||!p)return toast("E-posta ve şifre yaz");
  const show=t=>{const m=$("am");if(m){m.textContent=t;m.style.display=""}};
  try{await FB.login(e,p,r)}
  catch(x){
    if(x.code==="auth/invalid-credential"||x.code==="auth/user-not-found"){
      if(!confirm("Bu e-posta ve şifreyle giriş yapılamadı.\n\n"+e+"\n\nBu adresle yeni hesap oluşturulsun mu?\n(Adresi yanlış yazdıysan İptal'e bas; yeni hesap boş veriyle açılır.)"))return show("Giriş yapılmadı. E-posta veya şifreyi kontrol et.");
      try{await FB.register(e,p,r);NEWACC=true}
      catch(y){show(y.code==="auth/email-already-in-use"?"Bu e-posta kayıtlı ama şifre hatalı.":(AERR[y.code]||"Hata: "+(y.code||y.message)))}
    }else show(AERR[x.code]||("Hata: "+(x.code||x.message)));
  }
}
function fbReset(){const e=$("em").value.trim();if(!e)return toast("Önce e-posta adresini yaz");FB.reset(e).then(()=>toast("Şifre sıfırlama e-postası gönderildi")).catch(x=>toast(AERR[x.code]||x.code))}
function authHTML(){
  if(LOADING)return`<div class="card" style="margin:40px 0"><h2>⏳ Veriler yükleniyor…</h2></div>`;

  if(!window.FB)return`<div class="card k2" style="margin:40px 0"><h2>Bağlanıyor…</h2><p class="mute">Firebase yükleniyor.</p></div>`;
  return`<div class="center" style="color:var(--c1);margin-top:30px">${ic("dumbbell",56)}</div><h1 class="center" style="margin:6px 0 18px">Calisthenics Takip</h1>
  <div class="card k4"><h2>Giriş yap</h2>

  <button class="b wide" onclick="fbAuth()">Giriş yap / Kayıt ol</button><button class="g wide" onclick="fbReset()">Şifremi unuttum</button>
  <div class="tag bad" id="am" style="white-space:normal;${AUTHMSG?"":"display:none"}">${esc(AUTHMSG)}</div></div>`;
}

function bk(){try{if(!(window.FB&&FB.user))return;localStorage.setItem("cal_bk_"+FB.user.uid,JSON.stringify({weeks:S.weeks,status:S.status,logs:S.logs,library:S.library.map(m=>({name:m.name,anim:m.anim||"",mode:m.mode||"",regions:m.regions||[]})),profile:{name:(S.profile||{}).name||""}}))}catch(e){}}
function seedPresets(force){
  let add=0;const cur=S.seeded||0;
  PRESETS.forEach(([k,n,gs,v,mode,al])=>{
    const keys=[n,...(al||[])].map(canon),ex=S.library.find(m=>keys.includes(canon(m.name)));
    if(ex){let ch=false;if(!ex.anim){ex.anim=k;ch=true}if(!(ex.regions||[]).length&&gs.length){ex.regions=[...gs];ch=true}if(mode==="time"&&!ex.mode){ex.mode="time";ch=true}if(ch)pushLib(ex);return}
    if(force||v>cur){const m={name:n,img:"",anim:k,regions:[...gs],mode};S.library.push(m);pushLib(m);add++}
  });
  if(cur<3){S.seeded=3;save()}
  return add;
}
function restorePresets(){const n=seedPresets(true);S.library.sort((a,b)=>a.name.localeCompare(b.name,"tr"));toast(n?n+" hareket eklendi ✓":"Standart hareketlerin hepsi zaten var");render()}
