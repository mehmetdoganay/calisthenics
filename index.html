<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calisthenics">
<meta name="theme-color" content="#2f6df6">
<title>Calisthenics Takip</title>
<style>
:root{--bg:#f5f6fb;--card:#ffffff;--ink:#1b2130;--mute:#6b7688;--line:#e4e8f1;--acc:#4f6bff;--onacc:#ffffff;--c1:#4f6bff;--c2:#ff9f1c;--c3:#1fbf9a;--c4:#ff5c8a;--c5:#8a4dff;--bad:#e5484d}
@media(prefers-color-scheme:dark){:root{--bg:#0e1118;--card:#171b25;--ink:#eef1f7;--mute:#97a3b6;--line:#2a3140;--acc:#8196ff;--onacc:#0b1020;--c1:#8196ff;--c2:#ffb347;--c3:#4fd6b3;--c4:#ff86a8;--c5:#b08aff;--bad:#ff7a7f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,"Segoe UI",system-ui,sans-serif;transition:background .4s;min-height:100vh}
#hd{position:sticky;top:0;z-index:6;background:linear-gradient(120deg,#2f6df6,#8b5cf6 60%,#e53f8a);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:calc(6px + env(safe-area-inset-top)) 6px 6px}
#hd b{font-size:20px}
.hb{width:48px;height:44px;background:none;border:0;color:#fff;font-size:30px;cursor:pointer;line-height:1}
main{max-width:640px;margin:auto;padding:16px 16px 28px}
main.hasbar{padding-bottom:120px}main.full{padding:0;max-width:none}
h2{font-size:21px;margin:0 0 10px}h3{font-size:18px;margin:0 0 8px}h3.sec{margin:18px 2px 8px;color:var(--mute);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c1);border-radius:16px;padding:14px;margin-bottom:14px}
.card.k2{border-left-color:var(--c2)}.card.k3{border-left-color:var(--c3)}.card.k4{border-left-color:var(--c4)}.card.k5{border-left-color:var(--c5)}
input,select{font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
button{font:inherit}
button.b{min-height:54px;font-size:18px;font-weight:700;background:linear-gradient(120deg,var(--c1),var(--c5));color:#fff;border:0;border-radius:16px;padding:0 22px;cursor:pointer}
button.g,label.g{min-height:48px;display:inline-flex;align-items:center;justify-content:center;background:none;color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:0 16px;cursor:pointer;font-weight:600}
button.wide,label.wide{width:100%;margin-bottom:12px}
button.sm{min-height:38px;padding:0 12px;font-size:15px;border-radius:12px}
button.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:22px;width:44px;height:44px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.mute{color:var(--mute);font-size:15px}.center{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:10px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line)}
.bar button{flex:1}
.hello{font-size:26px;font-weight:800;margin:4px 2px 14px}
.today{border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,#ff7a1a,#e53f8a);margin-bottom:16px;box-shadow:0 6px 18px rgba(229,63,138,.3)}
.today small{opacity:.9;font-size:15px}.today b{display:block;font-size:26px;margin:2px 0}.today span{display:block;margin-bottom:12px;opacity:.95}
.today button{background:#fff;color:#c2185b;width:100%}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{border:0;border-radius:22px;min-height:136px;color:#fff;font-size:20px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.tile span{font-size:42px;line-height:1}
.li{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;cursor:pointer}
.li b{font-size:18px}
.weekbox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:14px}
.tag{font-size:13px;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--mute);white-space:nowrap;display:inline-block}
.tag.ok{color:var(--c3);border-color:var(--c3)}.tag.warn{color:var(--c2);border-color:var(--c2)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.up{color:var(--c3);font-weight:700}.dn{color:var(--bad);font-weight:700}.fl{color:var(--mute);font-weight:700}
.sr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-weight:700}
.sr:last-child{border:0}
.stp{display:flex;align-items:center;gap:6px}
.stp button{width:52px;height:52px;border-radius:50%;border:0;background:var(--line);color:var(--ink);font-size:28px;cursor:pointer;line-height:1}
.stp input{width:84px;height:52px;text-align:center;font-size:24px;font-weight:800;padding:0}
.seg2{display:flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;margin:8px 0}
.seg2 button{flex:1;min-height:50px;border:0;background:none;color:var(--ink);font-weight:700;cursor:pointer}
.seg2 button.on{background:var(--c1);color:#fff}
.dchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.dchip{flex:none;min-width:58px;padding:8px 6px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:center;line-height:1.2;cursor:pointer}
.dchip.on{background:var(--c1);border-color:var(--c1);color:#fff}.dchip small{display:block;font-size:12px;opacity:.85}
.dots2{display:flex;gap:6px;justify-content:center;margin:2px 0 14px}.dots2 i{width:34px;height:8px;border-radius:4px;background:var(--line)}.dots2 i.d{background:var(--c3)}.dots2 i.n{background:var(--c1)}
.mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.mt{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:8px 4px;text-align:center;color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.mt.on{border-color:var(--c1);background:#2f6df61a}
.addbtn{width:100%;min-height:60px;border:2px dashed var(--c1);border-radius:16px;background:none;color:var(--c1);font-weight:800;font-size:18px;cursor:pointer;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin-bottom:12px}
.stat{border:2px solid;border-radius:14px;padding:10px;font-size:14px}.stat b{display:block;font-size:26px;line-height:1.2}
.s1{background:#2f6df61a;border-color:var(--c1)}.s2{background:#ff7a1a1a;border-color:var(--c2)}.s3{background:#16a36a1a;border-color:var(--c3)}.s4{background:#e53f8a1a;border-color:var(--c4)}.s6{background:#d93a3a1a;border-color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.ex{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
label.s{display:flex;flex-direction:column;font-size:14px;font-weight:600;gap:2px}
.mi{border-radius:12px;object-fit:cover;flex:none;display:inline-block}.mi.ph{background:linear-gradient(135deg,var(--c1),var(--c4));color:#fff;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.ch{width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:6px 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px}
ul.sum{margin:6px 0 0;padding-left:20px}ul.sum li{margin-bottom:5px}
.seg{display:flex;height:18px;border-radius:9px;overflow:hidden;margin:8px 0}.seg i{display:block}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}.pg img,.cmp img{width:100%;border-radius:12px;display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* antrenman ekranı */
.wk{min-height:100vh;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 130px}
.wk .mute{color:rgba(255,255,255,.88)}
.wk button.g{color:#fff;border-color:rgba(255,255,255,.7)}
.wk .stp button{background:rgba(255,255,255,.25);color:#fff}.wk .stp input{background:#fff;color:#16202b;border-color:#fff}
.wk .sr{border-color:rgba(255,255,255,.3)}
.bar.wb{background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:0}
.bar.wb button.b{background:#fff;color:#111}.bar.wb button.g{color:#fff;border-color:rgba(255,255,255,.7)}
.badge{display:inline-block;background:rgba(0,0,0,.28);border-radius:20px;padding:6px 16px;font-size:20px;font-weight:800;margin-bottom:10px}
.timebar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.timebar b.t{font-size:30px;font-variant-numeric:tabular-nums}
.pbar{height:16px;background:rgba(255,255,255,.3);border-radius:8px;overflow:hidden;margin-bottom:14px}
.pbar i{display:block;height:100%;width:0;border-radius:8px;transition:width .8s ease;background:repeating-linear-gradient(45deg,#fff 0 12px,#ffe27a 12px 24px);background-size:34px 34px;animation:mv 1s linear infinite}
@keyframes mv{to{background-position:34px 0}}
@media(prefers-reduced-motion:reduce){.pbar i{animation:none}}
.plabel{display:flex;justify-content:space-between;font-weight:700;margin:4px 0 6px}
.mvname{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.mvname span{font-size:36px;font-weight:800;line-height:1.1}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{flex:1;min-width:96px;border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.2);text-align:center}
.chip small{display:block;font-size:16px;font-weight:700}.chip b{font-size:42px;line-height:1.1}.chip i{font-size:18px;font-style:normal;opacity:.9}
.dots{display:flex;gap:6px;margin-bottom:12px}.dots i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.35)}.dots i.d{background:#fff}.dots i.n{background:#ffd54a;box-shadow:0 0 0 3px rgba(255,255,255,.5)}
.bigcd{font-size:96px;font-weight:800;letter-spacing:-2px;line-height:1.1;margin:6px 0}
.info{background:rgba(0,0,0,.22);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-size:17px}
.chg{background:rgba(255,255,255,.22);border:2px dashed #fff;border-radius:14px;padding:10px 14px;margin:8px 0 12px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1}

.s5{background:#8b5cf61a;border-color:var(--c5)}
.hello{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none}
.avatar.ph{background:linear-gradient(135deg,var(--c1),var(--c4));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:800}
.anim{height:200px;background:rgba(255,255,255,.14);border-radius:18px;margin:6px 0 12px;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.anim svg{height:100%;width:auto;max-width:100%}.vimg{max-height:100%;max-width:100%;object-fit:contain}.vph{font-size:80px;font-weight:800;opacity:.6}
.av{background:linear-gradient(135deg,var(--c1),var(--c5));color:#fff;display:inline-flex;align-items:center;justify-content:center;padding:3px}.av svg{width:100%;height:100%}
.mt small{font-size:12px;font-weight:700}
.donut{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.donut svg{width:150px;height:150px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-auto-columns:1fr;gap:4px}.heat i{aspect-ratio:1;border-radius:4px;min-width:12px;background:var(--c3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}.cal b{font-size:12px;color:var(--mute)}.cal span{padding:8px 0;border-radius:10px;background:var(--bg);font-weight:700}
.cal span.ok{background:var(--c3);color:#fff}.cal span.half{background:var(--c2);color:#fff}.cal span.miss{background:var(--bad);color:#fff}.cal span.plan{border:2px solid var(--c1)}.cal span.td{outline:2px solid var(--ink)}
.rg{margin-bottom:12px}.rg .top{display:flex;justify-content:space-between;font-weight:700}.rg .meter{height:14px;border-radius:7px;background:var(--line);position:relative;overflow:hidden;margin:4px 0}
.rg .meter i{display:block;height:100%;border-radius:7px;position:relative}.rg .zone{position:absolute;top:0;bottom:0;background:rgba(22,163,106,.3);z-index:1}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:12px 0}.rpe button{height:72px;border:0;border-radius:16px;font-size:30px;font-weight:800;color:#fff;cursor:pointer}
.fchips{display:flex;gap:8px;overflow-x:auto;margin:8px 0 12px}.fchip{flex:none;padding:8px 14px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;cursor:pointer}.fchip.on{background:var(--c5);border-color:var(--c5);color:#fff}
.srch{width:100%;margin-bottom:8px}
select.rsel{padding:2px 8px;font-size:14px;border-radius:10px;min-height:34px;margin-top:4px}

/* ---- yumuşak tema ---- */
#hd{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 6px 8px}
#hd b{font-size:18px;font-weight:700}
.hb{color:var(--ink);display:flex;align-items:center;justify-content:center;border:0;background:none}
.ic{display:inline-block;vertical-align:-4px;flex:none}
button.b{background:var(--c1);color:var(--onacc);display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:none}
button.g,label.g{gap:8px}
.card{border-radius:18px;border-left-width:4px;box-shadow:0 1px 2px rgba(20,30,50,.05)}
.stat{border-width:1px;border-radius:14px}
.s1{background:color-mix(in srgb,var(--c1) 10%,var(--card))}.s2{background:color-mix(in srgb,var(--c2) 10%,var(--card))}.s3{background:color-mix(in srgb,var(--c3) 10%,var(--card))}.s4{background:color-mix(in srgb,var(--c4) 10%,var(--card))}.s5{background:color-mix(in srgb,var(--c5) 10%,var(--card))}.s6{background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.mi.ph,.avatar.ph{background:var(--bg);background:color-mix(in srgb,var(--c1) 14%,var(--card));color:var(--c1)}
.av{background:var(--bg);background:color-mix(in srgb,var(--c1) 12%,var(--card));color:var(--c1)}
.tiles{gap:12px}
.tile{background:var(--card);background:color-mix(in srgb,var(--tf) 9%,var(--card));color:var(--ink);border:1px solid var(--line);box-shadow:none;min-height:116px;border-radius:20px;font-size:16px;font-weight:700;gap:10px}
.tile .tl{font-size:16px;font-weight:700}.tile span{font-size:inherit}
.tile .ti{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--tf);background:var(--card);background:color-mix(in srgb,var(--tf) 16%,var(--card))}
.hello{font-size:22px;font-weight:700;margin:2px 2px 14px}
.dash{border-left-width:1px}
.dtop{display:flex;justify-content:space-between;align-items:center}.dbig{font-size:22px;font-weight:800}.dmsg{margin:6px 0 4px;font-weight:600}
.ring{width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--c3) calc(var(--p)*1%),var(--line) 0);display:flex;align-items:center;justify-content:center}
.ring span{width:46px;height:46px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.pbarS{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}.pbarS i{display:block;height:100%;background:var(--c3);border-radius:4px}
.drow{display:flex;align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--bg);margin-top:8px;cursor:pointer}.drow.tdy{outline:2px solid var(--c1)}
.dwd{width:38px;font-weight:700;color:var(--mute);font-size:13px;text-align:center}.dtags{display:flex;gap:4px;flex-wrap:wrap;margin:2px 0}
.tag.acc{color:var(--c1);border-color:var(--c1)}
.mv{display:flex;flex-direction:column}.mv .x{height:28px;width:40px}.x:disabled{opacity:.2;cursor:default}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.rchip{border:1px solid var(--line);background:none;color:var(--mute);border-radius:14px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer}.rchip.on{background:var(--rc);border-color:var(--rc);color:#fff}
.wkbtns{display:flex;gap:8px;margin-bottom:12px}.wkbtns button{flex:1}
.pause{position:fixed;inset:0;z-index:20;background:rgba(10,15,30,.88);display:flex;align-items:center;justify-content:center;padding:24px;color:#fff;text-align:center}.pause>div{width:100%;max-width:360px}
.pause button.b{background:#fff;color:#111}.pause button.g{color:#fff;border-color:#fff}
.timebar{flex-wrap:wrap}
.wkbtns button{padding:0 8px;font-size:14px;line-height:1.15}.wkbtns #mb{flex:0 0 46px}
.resume{border-left-color:var(--c2)}
.xcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer}
.xh{display:flex;align-items:center;gap:10px}
.idx{width:26px;height:26px;border-radius:50%;background:var(--c1);color:var(--onacc);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.dboxes{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.dbox{flex:1 1 64px;border-radius:12px;padding:6px 8px;text-align:center;background:var(--card);background:color-mix(in srgb,var(--bc) 11%,var(--card));border:1px solid var(--line);border-color:color-mix(in srgb,var(--bc) 35%,var(--line))}
.dbox b{display:block;font-size:19px;line-height:1.15;color:var(--bc)}
.dbox small{font-size:11px;color:var(--mute);font-weight:600}
.tiles .tile:last-child:nth-child(odd){grid-column:span 2}

/* ---- uygulama görünümü ---- */
button.b{background:linear-gradient(135deg,#8a4dff,#4f6bff);color:#fff;border-radius:28px;box-shadow:0 4px 12px rgba(79,107,255,.3)}
.card{border-radius:22px}
main.hastab{padding-bottom:110px}
#tb{position:fixed;left:0;right:0;bottom:0;z-index:7;display:none;justify-content:space-around;align-items:center;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
.tbi{flex:1;background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:4px 0;cursor:pointer}
.tbi.on{color:var(--c1)}
.tbc{width:62px;height:62px;border-radius:50%;border:4px solid var(--card);margin-top:-28px;background:linear-gradient(135deg,#a855f7,#4f6bff);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(79,107,255,.45);cursor:pointer}
.homeh{display:flex;align-items:center;gap:10px;margin:2px 0 10px}.hname{font-size:26px;font-weight:800;line-height:1.1}
.hb2{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:14px 18px;color:var(--mute);margin:4px 0 16px;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer}
.srow{display:flex;gap:8px;margin-bottom:10px;align-items:center}.srow .srch{margin:0;flex:1;border-radius:24px}.srow button{min-height:48px;padding:0 16px}
.gc{position:relative;overflow:hidden;border-radius:26px;padding:18px;color:#fff;margin-bottom:12px;min-height:110px;box-shadow:0 6px 16px rgba(0,0,0,.12)}

 .g2{grid-template-columns:minmax(0,1fr)}
 .dash-shortcuts{grid-template-columns:repeat(3,minmax(0,1fr))}
 .dash-shortcuts button{font-size:10px;padding:5px 3px}
 .homeh .hname{font-size:23px}
 .workout-step h2{font-size:21px}
 .workout-metrics{gap:7px}
 .workout-metrics>div{padding:8px 5px}
 .workout-metrics b{font-size:19px}
 .workout-top{gap:5px}
 .workout-sound{font-size:10px;padding:5px 7px}
 .workout-actions{gap:7px}
 .workout-actions button.g{flex-basis:38%;padding:0 8px}
 .wizard-nav{gap:8px}
 .wizard-nav button{padding:0 10px;font-size:15px}
}
@media(max-width:360px){
 .workout-toptext b{max-width:112px}
 .workout-sound{max-width:78px;white-space:normal;line-height:1.1}
 .workout-end{padding:7px;font-size:12px}
 .workout-actions button{font-size:14px;padding-left:8px;padding-right:8px}
 .dash-shortcuts{gap:4px}
}
@media(max-height:740px){
 .workout-content{padding-top:9px}
 .workout-visual{height:clamp(105px,20svh,170px);margin-bottom:7px}
 .workout-step{margin-bottom:7px}
 .workout-step h2{font-size:20px}
 .workout-metrics{margin:7px 0}
 .workout-live-edit{padding:9px;margin:7px 0}
}
@media(orientation:landscape) and (max-height:520px){
 .workout-visual{height:90px}
 .workout-content{padding-top:5px}
 .workout-step{margin-bottom:4px}
 .workout-actions button{min-height:42px}
}
@supports(height:100dvh){
 .authwrap{min-height:100dvh}
}


/* Antrenman sırasında sayaç, tekrar ve ağırlık değerlerini belirginleştir */
.workout-timer{max-width:340px;width:min(100%,340px);padding:18px 14px;margin:14px auto;background:linear-gradient(145deg,var(--card),var(--bg));border:2px solid var(--c1);box-shadow:0 8px 24px #0002}
.workout-timer b{font-size:clamp(58px,16vw,76px);line-height:1.05;font-weight:950;letter-spacing:-.045em;color:var(--ink);font-variant-numeric:tabular-nums}
.workout-timer small{display:block;margin-top:7px;font-size:13px;font-weight:800;letter-spacing:.02em}
.workout-metrics{gap:9px;margin:14px 0}
.workout-metrics>div{max-width:none;min-width:0;padding:12px 7px;border-width:1.5px;background:var(--card)}
.workout-metrics small{font-size:12px;font-weight:750}
.workout-metrics b{font-size:clamp(27px,7vw,35px);line-height:1.08;font-weight:950;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.workout-metrics b i{font-size:14px;font-weight:800}
.workout-dots{gap:9px;margin:13px}
.workout-dots i{width:11px;height:11px}
.workout-dots i.current{transform:scale(1.45);box-shadow:0 0 0 4px color-mix(in srgb,var(--c1) 18%,transparent)}
.workout-reps{max-width:360px;padding:13px}
.workout-reps>small{font-size:13px;margin-bottom:5px}
.workout-live-edit>div:first-child{font-size:14px}
.workout-live-grid input{font-size:21px;min-height:50px}
.rest-count{font-size:clamp(66px,19vw,86px);line-height:1.02;font-weight:950;letter-spacing:-.05em}
.workout-progress>div b{font-size:15px;font-weight:900;font-variant-numeric:tabular-nums}
.workout-progress>i{height:7px}
@media(max-width:430px){
 .workout-timer{padding:17px 10px;margin:12px auto}
 .workout-timer b{font-size:clamp(60px,18vw,74px)}
 .workout-metrics>div{padding:11px 5px}
 .workout-metrics b{font-size:clamp(28px,8vw,34px)}
 .rest-count{font-size:clamp(68px,20vw,82px)}
}
@media(max-height:740px){
 .workout-timer{padding:11px 10px;margin:8px auto}
 .workout-timer b{font-size:clamp(52px,14vw,64px)}
 .workout-metrics{margin:7px 0}
}

function countdownCue(left){
  if(left>5)return;
  snd(left<=2?"tick2":"tick");
  say(["","bir","iki","üç","dört","beş"][left]);
}
function tick(){
  if(!W||W.done||W.paused)return;
  {const nw=Date.now();W.seen=nw;if(nw-(W.lw||0)>3000){W.lw=nw;saveWip(true)}}
  const tt=$("tt");if(tt)tt.textContent=clock(Math.floor((Date.now()-W.start)/1000));
  if(W.phase==="work"||W.phase==="warm"){if(W.hold)holdTick();return}
  if(W.phase==="stretch"){
    const left=Math.max(0,Math.ceil(((W.stretchEnd||Date.now())-Date.now())/1000));
    const cd=$("cd");if(cd)cd.textContent=left+" sn";
    if(left<=0)nextStretch(true);
    else if(left<=5&&W.stretchLast!==left){W.stretchLast=left;countdownCue(left)}
    return;
  }
  if(W.phase==="rpe")return;
  const left=Math.ceil((W.end-Date.now())/1000);
  if(left<=0){
    const chg=W.ni&&W.ni[0]!==W.ei;
    snd(W.phase==="prep"?"go":chg?"change":"go");
    if(W.phase==="rest")say("Set başlıyor");
    toWork();return
  }
  if(left<=5&&W.lastSec!==left){W.lastSec=left;countdownCue(left)}
  const cd=$("cd");if(cd)cd.textContent=W.phase==="prep"?left:clock(left);
}
function toWork(){
  if(W.ni){W.ei=W.ni[0];W.si=W.ni[1];W.ni=null}
  const e=W.list[W.ei];W.lastSec=null;W.hold=null;W.restKind=null;
  W.phase=(W.si===0&&e.warm!==false&&!W.wd[W.ei])?"warm":"work";
  drawW();
}
function startHold(){
  const e=W.list[W.ei],ki=$("rk"),now=Date.now(),secs=W.phase==="warm"?warmOf(e).reps:e.reps;let kg=0;
  if(e.weighted){if(ki){clampIn(ki);kg=num(ki)}else kg=e.kg}
  try{if(window.speechSynthesis&&!MUTE)speechSynthesis.speak(new SpeechSynthesisUtterance(""))}catch(x){}
  ac();W.hold={ready:now+5000,end:now+5000+secs*1000,secs,kg,phase:W.phase,lastR:null,lastS:null,started:false};drawW();
}
function holdTick(){
  const h=W.hold,now=Date.now(),cd=$("cd"),lb=$("hl");
  if(now<h.ready){
    const l=Math.ceil((h.ready-now)/1000);if(cd)cd.textContent=l;if(lb)lb.textContent="Hazır ol…";
    if(h.lastR!==l){h.lastR=l;countdownCue(l);say(["","bir","iki","üç","dört","beş"][l]||"hazır ol")}return
  }
  if(!h.started){h.started=true;snd("go");say(h.phase==="warm"?"Isınma başladı":"Set başladı");if(lb)lb.textContent="Hareketi yap! Geri sayım sürüyor"}
  const left=Math.ceil((h.end-now)/1000);
  if(left<=0){holdEnd(true);return}
  if(cd)cd.textContent=left;
  if(left<=5&&h.lastS!==left){h.lastS=left;countdownCue(left)}
}
function holdEnd(auto){
  const h=W.hold,e=W.list[W.ei];if(!h)return;
  const held=auto?h.secs:Math.max(0,Math.min(h.secs,Math.round((Date.now()-h.ready)/1000)));
  W.hold=null;snd("holdEnd");
  if(h.phase==="warm"){W.wd[W.ei]=true;W.lastSec=null;const rest=Math.max(0,Number(e.warmRest)||0);if(rest>0){W.phase="rest";W.restKind="warm";W.end=Date.now()+rest*60000}else{W.phase="work";W.restKind=null}drawW();return}
  W.pend={ex:e.name,reps:held,kg:h.kg,weighted:e.weighted,tr:e.reps,u:"sn"};completeSet(null);
}
function warmDone(){
  W.wd[W.ei]=true;snd("set");W.lastSec=null;
  const rest=Math.max(0,Number(W.list[W.ei].warmRest)||0);
  if(rest>0){W.phase="rest";W.restKind="warm";W.end=Date.now()+rest*60000;W.lastSec=null;say("Isınma tamamlandı, dinlen");}
  else{W.phase="work";W.restKind=null}
  drawW()
}
function pauseW(){if(W.paused)return;W.paused=Date.now();drawW()}
function resumeW(){const d=Date.now()-W.paused;W.start+=d;if(W.end)W.end+=d;if(W.hold){W.hold.ready+=d;W.hold.end+=d}W.paused=null;drawW()}
function updateLiveTarget(field,id){
  if(!W||W.phase!=="work")return;

  v=field==="kg"?Math.max(0,Math.min(500,Math.round(v*2)/2)):Math.max(1,Math.min(600,Math.round(v)));
  el.value=String(v);
  e[field]=v;
  if(field==="reps")e.reps=v;else e.kg=v;

}
function finishSet(){

function completeSet(rpe){
  const e=W.list[W.ei];if(rpe!=null)W.pend.rpe=rpe;
  W.pend.round=W.round||1;

function stretchSegments(){return stretchList().flatMap((x)=>x.both?[0,1]:[0])}
function startStretch(){
  W.phase="stretch";W.hold=null;W.lastSec=null;W.end=null;W.stretchIndex=0;W.stretchSide=0;W.stretchSegment=0;W.stretchEnd=Date.now()+stretchList()[0].duration*1000;W.stretchLast=null;snd("change");say("Esneme başlıyor");drawW();

function nextStretch(auto=false){
  if(!W||W.phase!=="stretch")return;
  const st=stretchList()[W.stretchIndex||0];
  if(st.both&&W.stretchSide===0){W.stretchSide=1;W.stretchSegment++;}
  else {W.stretchIndex++;W.stretchSide=0;W.stretchSegment++;}
  if(W.stretchIndex>=stretchList().length){snd("fin");say("Esneme tamamlandı");endW(true);return}
  const nx=stretchList()[W.stretchIndex];W.stretchEnd=Date.now()+nx.duration*1000;W.stretchLast=null;snd("change");if(!auto)say("Sonraki esneme");drawW();

function rate(n){
  const idx=W.rpeResultIndex;
  if(Number.isInteger(idx)&&W.results[idx])W.results[idx].rpe=n;
  W.rpeMove=null;W.rpeResultIndex=null;W.rpeSetNumber=null;
  const next=W.ni,previous=W.list[W.ei];
  if(W.roundEnd){
    W.roundEnd=false;W.round=(W.round||1)+1;
    const rr=Math.max(0,Number(W.roundRest)||0);
    W.rpeAfterMove=false;
    if(rr>0){W.phase="rest";W.restKind="round";W.end=Date.now()+rr*60000;W.lastSec=null;drawW();return}
    W.restKind=null;toWork();return;
  }
  if(!next||next[0]>=W.list.length){startStretch();return}
  const rest=W.rpeAfterMove?restEndOf(previous):previous.rest;
  W.rpeAfterMove=false;W.restKind="set";
  if(rest<=0){toWork();return}
  W.phase="rest";W.end=Date.now()+rest*60000;W.lastSec=null;drawW();
}

  }

  W.ei++;W.si=0;W.ni=null;W.hold=null;W.lastSec=null;

function calorieBodyWeight(){
  const ps=(S.photos||[]).filter(p=>Number(p.bw)>0).sort((a,b)=>(b.month||"").localeCompare(a.month||"")||(b.id||0)-(a.id||0));
  return ps.length?Number(ps[0].bw):75;
}
function kcalForSets(ss){
  const activeSeconds=ss.reduce((sum,s)=>sum+(isT(s)?Math.max(0,s.reps):Math.max(0,s.reps)*3),0);
  const r=avgR(ss),met=r==null?6:(r<=5?5.5:r<=7?6:r<=8?6.5:r<=9?7:7.5);
  return Math.round((met*3.5*calorieBodyWeight()/200)*(activeSeconds/60));
}
function workoutHTML(L){
  const by={};L.sets.forEach(x=>{(by[x.ex]=by[x.ex]||[]).push(x)});
  const ar=avgR(L.sets),sc=sessSecs(L),U=a=>isT(a[0])?" sn":"";

function progHTML(i){
  const L=S.logs[i],names=[...new Set(L.sets.map(x=>x.ex))];let ok=0,cmp=0;
  const cards=names.map(n=>{
    const ss=L.sets.filter(x=>x.ex===n),a=agg(ss),pv=prevSess(n,i),w=ss.some(x=>x.weighted),T=ss.some(isT),U=T?"sn":"tekrar",ar=avgR(ss);let li="",verdict="",tc="";
    if(pv){const b=agg(pv.ss),br=avgR(pv.ss);cmp++;
      const useVol=w&&!T,up=useVol?(a.vol>b.vol||a.kg>b.kg):(w?(a.reps>b.reps||a.kg>b.kg):a.reps>b.reps),dn=useVol?(a.vol<b.vol&&a.kg<=b.kg):(w?(a.reps<b.reps&&a.kg<=b.kg):a.reps<b.reps);
      if(up){ok++;verdict="Progressive overload ✓";tc="ok"}else if(dn){verdict="Geriledin";tc="bad"}else{verdict="Aynı seviye";tc="warn"}
      li=`<li>Karşılaştırılan antrenman: ${dd(pv.date)} (${setsStr(pv.ss)})</li><li>${T?"Toplam süre":"Tekrar"}: ${b.reps} → <b>${a.reps}</b> ${U} ${pt(pc(a.reps,b.reps))}</li>`+(w?`<li>En yüksek ağırlık: ${b.kg} → <b>${a.kg} kg</b> ${pt(pc(a.kg,b.kg))}</li>`:"")+(useVol?`<li>Kaldırılan toplam: ${b.vol} → <b>${a.vol} kg</b> ${pt(pc(a.vol,b.vol))}</li>`:"")+`<li>Set sayısı: ${b.n} → ${a.n}</li>`+(ar!=null?`<li>Zorlanma (1–10): ${f1(br)} → <b>${f1(ar)}</b></li>`:"");
    }else li=`<li>Bu hareketin ilk kaydı; sonraki antrenman bununla kıyaslanacak.</li>`+(ar!=null?`<li>Ortalama zorlanma: <b>${f1(ar)}/10</b></li>`:"");
    const hit=ss.every(x=>x.tr==null||x.reps>=x.tr);let tip;
    if(!hit)tip=(T?"Hedef süreye her sette ulaşamadın: aynı süreyle devam et.":w?"Hedef tekrara her sette ulaşamadın: aynı ağırlıkta hedefi tamamlamaya çalış.":"Hedef tekrara her sette ulaşamadın: aynı hedefle devam et.")+(ar!=null&&ar>=9?" Zorlanman yüksek; gerekirse yükü veya hedefi azalt.":"");
    else if(ar==null)tip="Zorlanma puanı kaydedilmedi; bir sonraki antrenmanda aynı seviyeyi dene.";
    else if(ar<=5)tip=T?"Çok rahattı (RPE "+f1(ar)+"): sonraki programda süreyi 5–10 sn artır.":w?"Çok rahattı (RPE "+f1(ar)+"): ağırlığı yaklaşık 2–2,5 kg artırmayı dene.":"Çok rahattı (RPE "+f1(ar)+"): her sete 2 tekrar ekle veya daha zor varyasyona geç.";
    else if(ar<=7)tip=T?"Kontrollü tamamladın (RPE "+f1(ar)+"): süreyi 5 sn artır.":w?"Kontrollü tamamladın (RPE "+f1(ar)+"): ağırlığı yaklaşık 1–1,25 kg artırmayı dene.":"Kontrollü tamamladın (RPE "+f1(ar)+"): her sete 1 tekrar ekle.";
    else if(ar<=8)tip="Zorlayıcı ama yönetilebilirdi (RPE "+f1(ar)+"): aynı hedefi bir kez daha tamamla; sonra küçük artış yap.";
    else if(ar<=9)tip="Çok zorlandın (RPE "+f1(ar)+"): sonraki programda artış yapma, aynı seviyeyi koru.";
    else tip="Maksimum efora yaklaştın (RPE 10): sonraki programda yükü/hedefi yaklaşık %5–10 azalt veya toparlanmaya öncelik ver.";
    return`<div class="ex"><div class="row">${img(n,44)}<div style="flex:1;min-width:0"><b style="font-size:19px">${esc(n)}</b><div class="dtags">${regTags(regsOf(n))}</div></div>${verdict?`<span class="tag ${tc}">${verdict}</span>`:""}</div>
    <div class="mute">${a.n} set · ${a.reps} ${U}${w&&!T?" · "+a.vol+" kg kaldırdın":""} · ${setsStr(ss)}</div><ul class="sum">${li}<li><b>Öneri:</b> ${tip}</li></ul></div>`}).join("");
  return`<div class="card k2"><h2>Progressive overload analizi</h2>${cmp?`<p><b>${cmp}</b> hareketin <b>${ok}</b> tanesinde önceki antrenmana göre ilerleme var.</p>`:`<p class="mute">Karşılaştırma için önceki kayıt yok; bu antrenman başlangıç noktan olacak.</p>`}${cards}</div>`;

function movementPeriod(logs){
 const out={};
 logs.forEach(l=>(l.sets||[]).forEach(x=>{
  const a=out[x.ex]=out[x.ex]||{reps:0,maxKg:0,best:0,sets:0,weighted:false,time:false};
  a.reps+=Number(x.reps)||0;a.maxKg=Math.max(a.maxKg,Number(x.kg)||0);
  a.best=Math.max(a.best,Number(x.reps)||0);a.sets++;
  a.weighted=a.weighted||!!x.weighted;a.time=a.time||x.u==="sn";
 }));
 return out;
}
function regionPeriod(logs){
 const out={};REGIONS.forEach(g=>out[g]=0);
 logs.forEach(l=>(l.sets||[]).forEach(x=>regsOf(x.ex).forEach(g=>{out[g]=(out[g]||0)+1})));
 return out;
}
function durationSummary(logs){
 const total=logs.reduce((n,l)=>n+Math.max(0,Number(l.duration)||0),0);
 return{total,avg:logs.length?Math.round(total/logs.length/60):0};
}
function movementStats(logs){
 const out={};
 logs.forEach(l=>{
  const seen={};
  (l.sets||[]).forEach(x=>{
   const n=x.ex||"Bilinmeyen hareket",a=out[n]=out[n]||{reps:0,maxKg:0,best:0,sets:0,sessions:0,weighted:false,time:false,volume:0};
   const v=Number(x.reps)||0,kg=Number(x.kg)||0;

  const sessions=logs.length,sets=logs.reduce((n,l)=>n+(l.sets||[]).length,0),reps=logs.reduce((n,l)=>n+(l.sets||[]).reduce((a,x)=>a+(Number(x.reps)||0),0),0),mins=Math.round(logs.reduce((n,l)=>n+(Number(l.duration)||0),0)/60);

async function cloud(col,id,data){

function neon(){
  const col=["#ff2d95","#00e5ff","#7c4dff","#ffd600","#00e676","#ff6e40","#2979ff"];let h="";
  for(let i=0;i<30;i++){const sz=12+Math.floor(Math.random()*34),c=col[i%col.length],t=i%3,st=`left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*100).toFixed(1)}%;width:${sz}px;height:${sz}px;animation-delay:${(-Math.random()*9).toFixed(1)}s;animation-duration:${(7+Math.random()*6).toFixed(1)}s;box-shadow:0 0 18px ${c}77;`;
    h+=`<i class="shape" style="${st}${t===0?`background:${c};border-radius:50%`:t===1?`background:${c};border-radius:6px;transform:rotate(${Math.floor(Math.random()*80)}deg)`:`border:4px solid ${c};border-radius:50%`}"></i>`}
  return h;
}

const GUESS=[
 [["handstand","elstand"],"handstand",["Omuz","Karın"]],[["pike"],"pike",["Omuz"]],[["muscleup"],"muscleup",["Sırt","Göğüs"]],
 [["bench","chestpress","floorpress"],"pushup",["Göğüs"]],
 [["pushup","sinav","diamond","archer"],"pushup",["Göğüs","Kol"]],[["dip"],"dips",["Göğüs","Kol"]],
 [["pullup","chinup","barfiks","chin","lat"],"pullup",["Sırt","Kol"]],[["row","cekis"],"row",["Sırt"]],
 [["legraise","kneeraise","bacakkaldir"],"legraise",["Karın"]],[["deadhang","hang"],"deadhang",["Bilek","Sırt"]],
 [["squat","pistol","sissy"],"squat",["Bacak"]],[["lunge","split","stepup"],"lunge",["Bacak"]],[["bridge","kalca","glute","hipthrust"],"bridge",["Bacak"]],[["calf","topuk","deadlift","leg"],"squat",["Bacak"]],
 [["plank"],"plank",["Karın"]],[["hollow"],"hollow",["Karın"]],[["lsit"],"lsit",["Karın"]],[["crunch","mekik","situp","abs","core"],"crunch",["Karın"]],
 [["climber"],"climber",["Karın"]],[["burpee"],"burpee",["Göğüs","Bacak","Karın"]],
 [["curl","biceps","triceps","kickback","extension"],"curl",["Kol"]],[["press","shoulder","omuz","lateral"],"ohp",["Omuz"]],
 [["wrist","bilek"],"wristwarm",["Bilek"]],[["frog","kurbaga"],"frog",["Bilek","Kol"]]];
function guessFor(name){const c=canon(name);for(const [ks,a,r] of GUESS)if(ks.some(k=>c.includes(k)))return{anim:a,regions:r};return null}
function fallbackAnimFor(m){
  const g=guessFor(m.name);if(g)return g.anim;
  const c=canon(m.name||""),r=m.regions||[];
  if(/deadlift|hinge|romanian|rdl|legpress|legextension|legcurl|calf|topuk|stepup|stepdown|split|lunge|squat|glute|hipthrust/.test(c))return "squat";
  if(/row|pull|barfiks|chin|lat|back|cekis/.test(c))return "row";
  if(/press|shoulder|omuz|pike|handstand|elstand|lateral|raise/.test(c))return "ohp";
  if(/curl|biceps|triceps|extension|kickback|kol/.test(c))return "curl";
  if(/plank|hollow|core|abs|karin|crunch|mekik|situp|legraise|knee/.test(c))return "plank";
  if(/wrist|bilek|mobility|warm|isinma|stretch|esnet/.test(c))return "wristwarm";
  if(r.includes("Bacak"))return "squat";
  if(r.includes("Sırt"))return "row";
  if(r.includes("Omuz"))return "ohp";
  if(r.includes("Kol"))return "curl";
  if(r.includes("Karın"))return "plank";
  if(r.includes("Bilek"))return "wristwarm";
  if(r.includes("Göğüs"))return "pushup";
  return "general";
}
function seedPresets(force){
  let add=0;const cur=S.seeded||0;
  PRESETS.forEach(([k,n,gs,v,mode,al])=>{
    const keys=[n,...(al||[])].map(canon),ex=S.library.find(m=>keys.includes(canon(m.name)));
    if(ex){let ch=false;if(!ex.anim){ex.anim=k;ch=true}if(!(ex.regions||[]).length&&gs.length){ex.regions=[...gs];ch=true}if(mode==="time"&&!ex.mode){ex.mode="time";ch=true}if(ch)pushLib(ex);return}
    if(force||v>cur){const m={name:n,img:"",anim:k,regions:[...gs],mode};S.library.push(m);pushLib(m);add++}
  });
  S.library.forEach(m=>{
    let ch=false;
    if(!m.anim){m.anim=fallbackAnimFor(m);ch=true}
    if(!(m.regions||[]).length){const g=guessFor(m.name);if(g){m.regions=[...g.regions];ch=true}}
    if(ch)pushLib(m);
  });
  if(cur<5){S.seeded=5;save()}
  return add;
}
function restorePresets(){const n=seedPresets(true);S.library.sort((a,b)=>a.name.localeCompare(b.name,"tr"));toast(n?n+" hareket eklendi ✓":"Standart hareketlerin hepsi zaten var");render()}
history.replaceState({n:1},"");
